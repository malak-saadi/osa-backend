<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OSA Monitor — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f0f2f8; --card: #ffffff; --primary: #3b6ef8;
      --muted: #64748b; --border: #e2e8f0; --danger: #ef4444;
      --danger-bg: #fee2e2; --danger-border: #fecaca;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(59,110,248,0.07);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .brand-icon {
      width: 40px; height: 40px;
      background: var(--primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .brand-name { font-size: 15px; font-weight: 700; }
    .brand-sub  { font-size: 11px; color: var(--muted); }

    h2 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 1.75rem; }

    .error-box {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--danger);
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .error-box.show { display: flex; }

    .field { margin-bottom: 1.1rem; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 7px;
    }
    .input-wrap { position: relative; }
    .input-wrap .input-icon {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #94a3b8;
      pointer-events: none;
    }
    .input-wrap input {
      width: 100%;
      padding: 0 12px 0 38px;
      height: 44px;
      font-size: 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      color: #1e293b;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrap input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(59,110,248,0.12);
    }
    .eye-btn {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #94a3b8; font-size: 16px; padding: 2px;
      display: flex; align-items: center;
      transition: color 0.2s;
    }
    .eye-btn:hover { color: var(--primary); }

    .forgot-link {
      display: block; text-align: right;
      font-size: 12px; color: var(--primary);
      text-decoration: none; margin-top: 6px;
    }
    .forgot-link:hover { text-decoration: underline; }

    .login-btn {
      width: 100%; height: 46px;
      background: var(--primary); color: #fff;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; margin-top: 0.75rem;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity 0.2s;
      font-family: inherit;
    }
    .login-btn:hover:not(:disabled) { opacity: 0.88; }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.75rem 0;
    }
    .register-row {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
    .register-row a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .register-row a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="login-card">

    <div class="brand">
      <div class="brand-icon">🫀</div>
      <div>
        <div class="brand-name">OSA Monitor</div>
        <div class="brand-sub">Sleep Analytics v1.0</div>
      </div>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your account to continue</p>

    <div class="error-box" id="errorBox">
      <i class="ti ti-alert-circle"></i>
      <span id="errorMsg">Invalid username or password.</span>
    </div>

    <div class="field">
      <label for="username">Username</label>
      <div class="input-wrap">
        <i class="ti ti-user input-icon"></i>
        <input type="text" id="username" placeholder="your_username" autocomplete="username"/>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <i class="ti ti-lock input-icon"></i>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
        <button class="eye-btn" id="eyeBtn" type="button" aria-label="Toggle password visibility">
          <i class="ti ti-eye" id="eyeIcon"></i>
        </button>
      </div>
      <a class="forgot-link" href="forgot_password.html">Forgot password?</a>
    </div>

    <button class="login-btn" id="loginBtn" onclick="handleLogin()">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Sign in</span>
    </button>

    <hr class="divider"/>
    <p class="register-row">
      Don't have an account? <a href="register.html">Register</a>
    </p>

  </div>

<script>
  const API_BASE = 'http://127.0.0.1:8000';

  // Toggle password visibility
  document.getElementById('eyeBtn').addEventListener('click', () => {
    const input = document.getElementById('password');
    const icon  = document.getElementById('eyeIcon');
    if (input.type === 'password') {
      input.type    = 'text';
      icon.className = 'ti ti-eye-off';
    } else {
      input.type    = 'password';
      icon.className = 'ti ti-eye';
    }
  });

  // Submit on Enter key
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });

  function showError(msg) {
    const box = document.getElementById('errorBox');
    document.getElementById('errorMsg').textContent = msg;
    box.classList.add('show');
  }

  function hideError() {
    document.getElementById('errorBox').classList.remove('show');
  }

  function setLoading(on) {
    document.getElementById('spinner').style.display = on ? 'block' : 'none';
    document.getElementById('btnText').textContent   = on ? 'Signing in…' : 'Sign in';
    document.getElementById('loginBtn').disabled     = on;
  }

  async function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    hideError();

    if (!username || !password) {
      showError('Please enter your username and password.');
      return;
    }

    setLoading(true);

    try {
      const res  = await fetch(`${API_BASE}/api/auth/login/`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username, password }),
      });

      const data = await res.json();

      if (res.ok && data.tokens) {
        // Save tokens and user info
        localStorage.setItem('access_token',  data.tokens.access);
        localStorage.setItem('refresh_token', data.tokens.refresh);
        localStorage.setItem('user',          JSON.stringify(data.user));

        // Redirect to dashboard
        window.location.href = 'dashboard.html';
      } else {
        // Parse DRF error shapes
        const msg = data?.detail
          || data?.non_field_errors?.[0]
          || data?.username?.[0]
          || data?.password?.[0]
          || 'Invalid credentials. Please try again.';
        showError(msg);
      }
    } catch (e) {
      showError('Cannot connect to server. Make sure the backend is running.');
    } finally {
      setLoading(false);
    }
  }
</script>

</body>
</html>
